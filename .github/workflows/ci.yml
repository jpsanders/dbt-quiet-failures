---
name: integration tests

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  duckdb:
    name: duckdb (${{ matrix.dbt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dbt 1.10's serialiser fails on Python 3.14, so it keeps 3.13; the latest dbt runs on 3.14.
          - dbt: "1.10"
            python: "3.13"
            install: '"dbt-core~=1.10.0" "dbt-duckdb~=1.10.0"'
          - dbt: "latest"
            python: "3.14"
            install: "dbt-duckdb"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dbt ${{ matrix.dbt }} with DuckDB
        run: pip install ${{ matrix.install }}
      - name: Prove each check fails on its fault and passes on clean data
        run: integration_tests/run.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: The man page matches docs/MANUAL.md
        run: python3 scripts/build_man.py --check
